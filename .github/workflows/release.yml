name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --clean --windowed --name FretFlow --collect-all sounddevice --collect-all _sounddevice_data --exclude-module tkinter main.py
      - run: Compress-Archive -Path dist/FretFlow/* -DestinationPath FretFlow-windows.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: FretFlow-windows.zip
          generate_release_notes: true
